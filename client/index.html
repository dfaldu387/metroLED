<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#1a56db" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="MetroLED Intelligence" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MetroLED" />
    <meta
      name="description"
      content="Business intelligence for MetroLED, Pixel LED Displays and Eco LED Mart: revenue, receivables, pipeline, e-commerce and gross margin in one place."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <title>MetroLED Intelligence</title>
    <script>
      // Apply the saved theme before the first paint so dark mode never flashes white.
      // Mirrors client/src/lib/theme.ts; keep the two in step.
      (function () {
        try {
          var stored = localStorage.getItem('metroled-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
